<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>PetShop Amigo Fiel - Serviços</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>PetShop Amigo Fiel</h1>
      <nav aria-label="Navegação Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="servicos.html">Serviços e Agendamento</a></li>
          <li><a href="contato.html">Contato e Cadastro</a></li>
          <li><a href="ajuda.html">Ajuda</a></li>
        </ul>
      </nav>
    </header>

    <main style="max-width: 800px; margin: 20px auto; padding: 10px">
      <h2>Agendamento de Banho e Tosa</h2>

      <form id="form-agendamento">
        <p>
          <label for="nomeClienteAg">Nome do Tutor: *</label><br />
          <input
            type="text"
            id="nomeClienteAg"
            required
            placeholder="Seu nome"
          />
        </p>
        <p>
          <label for="nomePetAg">Nome do Pet: *</label><br />
          <input
            type="text"
            id="nomePetAg"
            required
            placeholder="Nome do pet"
          />
        </p>
        <p>
          <strong>Serviços Desejados: *</strong><br />
          <input type="checkbox" id="servicoBanho" value="Banho" />
          <label for="servicoBanho">Banho</label>
          <input type="checkbox" id="servicoTosa" value="Tosa" />
          <label for="servicoTosa">Tosa</label>
        </p>
        <p>
          <strong>Método de Agendamento: *</strong><br />
          <input
            type="radio"
            id="telebusca"
            name="metodo"
            value="Tele-busca"
            required
          />
          <label for="telebusca">Tele-busca (Buscamos no local)</label
          ><br />
          <input
            type="radio"
            id="local"
            name="metodo"
            value="Entrega no Local"
            required
          />
          <label for="local"
            >Entrega do pet no local pelo tutor</label
          >
        </p>
        <p>
          <label for="dataAg">Data do Agendamento: *</label><br />
          <input type="date" id="dataAg" required />
        </p>
        <p>
          <label for="horaAg">Horário: *</label><br />
          <input type="time" id="horaAg" required />
        </p>
        <button type="submit">Confirmar Agendamento</button>
      </form>
    </main>

    <footer>
      <p>
        &copy; 2026 PetShop Amigo Fiel. Todos os direitos reservados.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
