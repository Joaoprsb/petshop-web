<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>PetShop Amigo Fiel - Cadastro e Contato</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>PetShop Amigo Fiel</h1>
      <nav aria-label="Navegação Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="servicos.html">Serviços e Agendamento</a></li>
          <li><a href="contato.html">Contato e Cadastro</a></li>
          <li><a href="ajuda.html">Ajuda</a></li>
        </ul>
      </nav>
    </header>

    <main style="max-width: 800px; margin: 20px auto; padding: 10px">
      <h2>Formulário de Cadastro do Cliente e do Pet</h2>

      <form id="form-cadastro">
        <h3>Dados do Cliente</h3>
        <p>
          <label for="nomeCliente">Nome Completo: *</label><br />
          <input
            type="text"
            id="nomeCliente"
            placeholder="Ex: Maria Silva"
            required
          />
        </p>
        <p>
          <label for="cpfCliente">CPF: *</label><br />
          <input
            type="text"
            id="cpfCliente"
            placeholder="000.000.000-00"
            required
          />
        </p>
        <p>
          <label for="sexoCliente">Sexo:</label><br />
          <select id="sexoCliente">
            <option value="">Selecione...</option>
            <option value="F">Feminino</option>
            <option value="M">Masculino</option>
            <option value="O">Outro</option>
          </select>
        </p>
        <p>
          <label for="telCliente">Telefone: *</label><br />
          <input
            type="tel"
            id="telCliente"
            placeholder="(00) 00000-0000"
            required
          />
        </p>
        <p>
          <label for="emailCliente">E-mail: *</label><br />
          <input
            type="email"
            id="emailCliente"
            placeholder="exemplo@email.com"
            required
          />
        </p>
        <p>
          <label for="endCliente">Endereço: *</label><br />
          <input
            type="text"
            id="endCliente"
            placeholder="Rua, Número, Bairro"
            required
          />
        </p>

        <hr />
        <h3>Dados do Pet</h3>
        <p>
          <label for="nomePet">Nome do Pet: *</label><br />
          <input
            type="text"
            id="nomePet"
            placeholder="Ex: Rex"
            required
          />
        </p>
        <p>
          <label for="racaPet">Raça: *</label><br />
          <input
            type="text"
            id="racaPet"
            placeholder="Ex: Poodle"
            required
          />
        </p>
        <p>
          <label for="idadePet">Idade (anos): *</label><br />
          <input
            type="number"
            id="idadePet"
            min="0"
            max="30"
            placeholder="Ex: 3"
            required
          />
        </p>

        <button type="submit">Cadastrar</button>
      </form>
    </main>

    <footer>
      <p>
        &copy; 2026 PetShop Amigo Fiel. Todos os direitos reservados.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
